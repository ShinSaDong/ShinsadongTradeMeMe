<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ site.Home.RelPermalink }}">Shinsadong<span>TradeMeMe</span></a>
    <nav>
      {{ $current := . }}
      {{ range site.Menus.main }}
      {{ $href := .URL }}
      <a href="{{ $href }}" {{ if hasPrefix $current.RelPermalink $href }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
