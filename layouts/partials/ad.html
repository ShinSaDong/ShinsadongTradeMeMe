{{/* 애드센스 수동 광고 슬롯. hugo.toml 의 adsenseClient 가 비어 있으면 아무것도 출력하지 않습니다.
   자동 광고만 쓸 거라면 이 파셜은 그대로 두어도 됩니다. slot 번호는 애드센스에서 광고 단위를 만든 뒤 넣으세요. */}}
{{ with site.Params.adsenseClient }}{{ with site.Params.adsenseSlot }}
<div class="ad-slot">
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ site.Params.adsenseClient }}" data-ad-slot="{{ . }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{{ end }}{{ end }}
