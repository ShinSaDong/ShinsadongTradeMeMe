<footer class="site-footer">
  <div class="container">
    <p class="disclaimer">{{ i18n "disclaimer" }}</p>
    <p>
      <a href="{{ "about/" | relLangURL }}">{{ i18n "about" }}</a> ·
      <a href="{{ "privacy/" | relLangURL }}">{{ i18n "privacy" }}</a> ·
      <a href="{{ "contact/" | relLangURL }}">{{ i18n "contact" }}</a> ·
      <a href="{{ "index.xml" | relLangURL }}">RSS</a>
    </p>
    {{ with site.Params.contactEmail }}<p class="footer-contact">{{ i18n "inquiry" }} <a href="mailto:{{ . }}">{{ . }}</a></p>{{ end }}
    <p>© {{ now.Year }} {{ site.Title }}</p>
  </div>
</footer>
