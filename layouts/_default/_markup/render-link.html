{{- $u := .Destination -}}
{{- if and (hasPrefix $u "/") (not (hasPrefix $u "//")) -}}{{- $u = strings.TrimPrefix "/" $u | relLangURL -}}{{- end -}}
<a href="{{ $u | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if hasPrefix .Destination "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Text | safeHTML }}</a>
