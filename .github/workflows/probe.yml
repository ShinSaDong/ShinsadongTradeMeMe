name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for u in \
            "https://m.stock.naver.com/api/index/KOSPI/trend?pageSize=5&page=1" \
            "https://m.stock.naver.com/api/index/KOSPI/trend" \
            "https://m.stock.naver.com/api/index/KOSPI/dealTrend?pageSize=5" \
            "https://m.stock.naver.com/api/index/KOSPI/investor?pageSize=5" \
            "https://m.stock.naver.com/api/index/KOSPI/dealTrendInfo?pageSize=5" \
            "https://m.stock.naver.com/api/index/KOSPI/price?pageSize=5&page=1" \
            "https://m.stock.naver.com/api/index/KOSPI/programTrend?pageSize=5" \
            "https://m.stock.naver.com/front-api/index/dealTrend?indexCode=KOSPI&pageSize=5" \
            "https://m.stock.naver.com/api/index/KOSPI/investorTrend?pageSize=5" ; do
            echo "=== $u"; curl -s -m 15 -A "$UA" -H "Referer: https://m.stock.naver.com/" -w "\nHTTP %{http_code}\n" "$u" | head -c 900; echo; done
          echo "=== fchart kosdaq"; curl -s -A "$UA" "https://fchart.stock.naver.com/sise.nhn?symbol=KOSDAQ&timeframe=day&count=3&requestType=0" | grep item
