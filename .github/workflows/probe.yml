name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          for u in \
            "https://polling.finance.naver.com/api/realtime/domestic/index/KOSDAQ150" \
            "https://polling.finance.naver.com/api/realtime/domestic/index/KPI150" \
            "https://polling.finance.naver.com/api/realtime/domestic/index/KQ150F" \
            "https://fchart.stock.naver.com/sise.nhn?symbol=KQ150&timeframe=day&count=2&requestType=0" \
            "https://fchart.stock.naver.com/sise.nhn?symbol=KOSDAQ150&timeframe=day&count=2&requestType=0" \
            "https://fchart.stock.naver.com/sise.nhn?symbol=KPI200&timeframe=day&count=2&requestType=0" \
            "https://finance.naver.com/sise/sise_index.naver?code=KQ150" \
            "https://m.stock.naver.com/api/index/KOSDAQ/basic" \
            "https://m.stock.naver.com/front-api/marketIndex/domestic?category=index" ; do
            echo "=== $u"; curl -s -m 15 -A "$UA" -H "Referer: https://m.stock.naver.com/" -w "\nHTTP %{http_code}\n" "$u" | head -c 700; echo; done
