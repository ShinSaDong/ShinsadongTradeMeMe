name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36"
          for c in 005930 000660 042700 009150 011070 007660 353200 222800 007810 195870 277810 454910 108490 005380; do
            echo "=== $c"; curl -s -m 15 -A "$UA" "https://fchart.stock.naver.com/sise.nhn?symbol=$c&timeframe=day&count=6&requestType=0" | grep -o 'data="[^"]*"' | tr '\n' ' '; echo; done
