name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          for c in 005930 000660 042700 009150 011070 007660 353200 222800 007810 195870 277810 454910 108490 005380 KOSPI KOSDAQ; do
            if [[ $c =~ ^[0-9]+$ ]]; then u="https://m.stock.naver.com/api/stock/$c/price?pageSize=6&page=1"; else u="https://m.stock.naver.com/api/index/$c/price?pageSize=6&page=1"; fi
            echo "=== $c"; curl -s -m 15 -A "$UA" -H "Referer: https://m.stock.naver.com/" "$u" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([[r.get('localTradedAt'),r.get('closePrice'),r.get('fluctuationsRatio')] for r in d],ensure_ascii=False))" ; done
          echo "=== FLOW"; curl -s -m 30 "https://shinsadongtradememe.com/api/flow?date=20261124&step=5" -o flow.json; python3 - <<'P'
          import json
          d=json.load(open("flow.json"))
          for s in d["snaps"]:
              if s["slot"] in ("0900","0905","0910","0930","1000","1030","1100","1130","1200","1300","1330","1400","1430","1500","1520","1530","1600"):
                  K=s["markets"].get("KOSPI",{}); dl=K.get("deal") or {}; pg=K.get("prog") or {}
                  print(s["slot"], K.get("price"), K.get("rate"), dl.get("ind"), dl.get("frg"), dl.get("ins"), pg.get("total"))
          P
