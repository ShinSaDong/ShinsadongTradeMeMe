# GitHub Pages 배포
# - main 에 push 할 때마다 배포
# - 평일 KST 08:00~20:05 동안 5분마다 국내 데이터를 새로 받아 재배포 (NXT 프리·애프터마켓 포함)
#   (GitHub 예약 실행은 붐비면 5~15분 늦어질 수 있습니다)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 23 * * 0-4"     # UTC 23시(전날) = KST 08:00~08:55 (NXT 프리마켓)
    - cron: "*/5 0-10 * * 1-5"   # UTC 00~10시 = KST 09:00~19:55 (정규장 + NXT 애프터마켓)
    - cron: "5 11 * * 1-5"       # KST 20:05 마지막 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.139.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 국내 데이터 받기 (네이버 금융)
        run: node scripts/fetch-kr.mjs static/data/kr
        continue-on-error: true

      - name: Hugo 설치
        run: |
          wget -q -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - id: pages
        uses: actions/configure-pages@v5

      - name: 빌드
        env:
          HUGO_PARAMS_KRDATAMODE: static
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
