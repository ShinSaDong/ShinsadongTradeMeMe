baseURL = "https://shinsadongtradememe.com/"
defaultContentLanguage = "ko"
title = "ShinsadongTradeMeMe"
timeZone = "Asia/Seoul"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 10

[params]
  author = "Shinsadong"
  # 구글 애드센스 승인 후 게시자 ID를 넣으면 모든 페이지에 광고 스크립트가 들어갑니다. 예: "ca-pub-1234567890123456"
  adsenseClient = "ca-pub-5739503575089778"
  contactEmail = "sin8361@gmail.com"
  # 검색 등록 소유 확인 코드: 메타 태그의 content="..." 안쪽 값만 넣으면 모든 페이지 <head> 에 들어갑니다.
  googleSiteVerification = ""
  # 구글 애널리틱스 4 측정 ID
  gaMeasurementId = "G-CFR191LJR5"
  # Cloudflare Web Analytics 토큰 (비어 있으면 안 넣음)
  cfBeaconToken = ""
  naverSiteVerification = "7e17bc4597598ef89d19a1529218f1bde2085ac9"

defaultContentLanguageInSubdir = false

[languages]
  [languages.ko]
    languageCode = "ko-KR"
    languageName = "한국어"
    languageDirection = "ltr"
    weight = 1
    [languages.ko.params]
        [[languages.ko.menus.main]]
      name = "종합투자"
      pageRef = "/market"
      weight = 1
    [[languages.ko.menus.main]]
      name = "대시보드"
      pageRef = "/dashboard"
      weight = 2
    [[languages.ko.menus.main]]
      name = "단타"
      pageRef = "/scalp"
      weight = 3
    [[languages.ko.menus.main]]
      name = "블로그"
      pageRef = "/posts"
      weight = 4
    [[languages.ko.menus.main]]
      name = "소개"
      pageRef = "/about"
      weight = 5
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    languageDirection = "ltr"
    weight = 2
    [languages.en.params]
      description = "Real-time KOSPI/KOSDAQ investor flows, market mood, Binance long/short vs. Korean market, and intraday pattern scans in one place."
    [[languages.en.menus.main]]
      name = "Market Flow"
      pageRef = "/market"
      weight = 1
    [[languages.en.menus.main]]
      name = "Dashboard"
